[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, B bugbear, UP pyupgrade, SIM simplificaciones
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# La carpeta ./alembic (migraciones) no es el paquete alembic instalado.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones generadas por Alembic usan su propio estilo.
"alembic/versions/*" = ["UP006", "UP007", "UP035", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Umbral realista sobre rutas críticas; no se persigue un porcentaje artificial.
fail_under = 90
